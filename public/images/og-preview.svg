  </text>
  <text x="600" y="415" font-family="'Cormorant Garamond', Georgia, serif" font-size="64" fill="#51483F" text-anchor="middle">
    Priyanka &amp; Paras
  </text>
  <text x="600" y="470" font-family="'Great Vibes', cursive" font-size="40" fill="#B69A72" text-anchor="middle">
    The Golden Vow
  </text>
  <text x="600" y="520" font-family="'DM Sans', sans-serif" font-size="14" letter-spacing="4" font-weight="500" fill="#8C8176" text-anchor="middle">
    DECEMBER 14, 2026 • BHAVNAGAR, GUJARAT
  </text>
