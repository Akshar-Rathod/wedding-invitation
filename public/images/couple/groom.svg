  <rect x="25" y="25" width="550" height="700" fill="#FFFFFF" stroke="#D9C4A3" stroke-width="1.8"/>
  <rect x="36" y="36" width="528" height="678" fill="#FAF7F2" stroke="#B69A72" stroke-opacity="0.3" stroke-width="1"/>

  <!-- Arch Silhouette -->
  <path d="M140 490 C140 260 460 260 460 490" stroke="#D9C4A3" stroke-width="1.8" stroke-dasharray="3 3"/>
  <circle cx="300" cy="350" r="130" stroke="#B69A72" stroke-width="1"/>
  <circle cx="300" cy="350" r="105" fill="#FFFFFF" stroke="#D9C4A3" stroke-width="1"/>

